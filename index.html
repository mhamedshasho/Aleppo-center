<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دفتر الحسابات</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <!-- ======= إضافة حساب ======= -->
    <header class="top">
        <h1>دفتر الحسابات</h1>
        <div class="add-account">
            <input type="text" id="accountName" placeholder="اسم الحساب">
            <button onclick="addAccount()">➕ إضافة حساب</button>
        </div>
        <input type="text" id="searchAccount" placeholder="🔍 بحث عن حساب" oninput="searchAccounts()">
    </header>

    <!-- ======= عرض الحسابات ======= -->
    <section id="accountsView" class="accounts-grid">
        <!-- الحسابات تظهر هنا كبطاقات -->
    </section>

    <!-- ======= تفاصيل الحساب ======= -->
    <section id="accountDetail" class="account-detail" style="display:none;">

        <div class="account-header">
            <button class="back" onclick="backToAccounts()">⬅ رجوع</button>
            <h2 id="accountTitle"></h2>
            <button class="delete-account" onclick="deleteCurrentAccount()">🗑 حذف الحساب</button>
        </div>

        <!-- ======= إضافة دفعة ======= -->
        <div class="add-payment">
            <input type="number" id="paymentAmount" placeholder="المبلغ">
            
            <select id="paymentCurrency">
                <option value="USD">دولار $</option>
                <option value="SYP">ليرة سورية</option>
            </select>

            <input type="text" id="paymentType" placeholder="اسم / نوع الدفعة">
            
            <button onclick="addPayment()">➕ إضافة دفعة</button>
        </div>

        <!-- ======= بحث داخل الدفعات ======= -->
        <input 
            type="text" 
            id="searchPayment" 
            placeholder="🔍 بحث عن دفعة (اسم أو مبلغ)" 
            oninput="renderCurrentAccount()"
        >

        <!-- ======= جدول الدفعات ======= -->
        <div id="info" class="table-container">
            <!-- الجدول يظهر هنا -->
        </div>

    </section>

</div>

<script src="script.js"></script>
</body>
</html>
