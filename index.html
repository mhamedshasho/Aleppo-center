<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>كشف حساب</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <h2>كشف حساب</h2>
        <h3 id="accountName">اسم الحساب</h3>
        <p>مركز حلب – حلب منطقة الكلاسة – المنطقة الصناعية</p>
    </div>

    <!-- ADD PAYMENT -->
    <div class="add-box">
        <input type="date" id="date">
        <input type="text" id="details" placeholder="التفاصيل">
        <input type="number" id="amount" placeholder="المبلغ">

        <select id="currency">
            <option value="syp">سوري</option>
            <option value="usd">دولار</option>
        </select>

        <select id="type">
            <option value="credit">له</option>
            <option value="debit">عليه</option>
        </select>

        <button onclick="addPayment()">إضافة دفعة</button>
    </div>

    <!-- TABLE -->
    <table>
        <thead>
            <tr>
                <th>التاريخ</th>
                <th>التفاصيل</th>
                <th>عليه</th>
                <th>له</th>
                <th>الرصيد</th>
                <th>حذف</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>

        <tfoot>
            <tr class="total-row">
                <td colspan="2">إجمالي العمليات</td>
                <td id="totalDebit">0</td>
                <td id="totalCredit">0</td>
                <td colspan="2"></td>
            </tr>
            <tr class="balance-row">
                <td colspan="6" id="finalBalance">الرصيد الإجمالي: 0</td>
            </tr>
        </tfoot>
    </table>

</div>

<script src="script.js"></script>
</body>
</html>
