<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتر الدفعات</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <h1>دفتر الدفعات</h1>

  <!-- إضافة دفعة -->
  <div class="card">
    <h2>إضافة دفعة</h2>
    <div class="form-grid">
      <input id="name" placeholder="اسم الحساب / الشخص">
      <input id="amount" type="number" placeholder="المبلغ">
      <select id="currency">
        <option value="USD">دولار</option>
        <option value="SYP">سوري</option>
      </select>
      <input id="type" placeholder="نوع الدفعة (إيجار، كهرباء...)">
      <input id="date" type="date">
      <button onclick="addPayment()">إضافة</button>
    </div>
  </div>

  <!-- البحث و الفلترة -->
  <div class="card">
    <h2>بحث و فلترة</h2>
    <div class="form-grid">
      <input id="search" placeholder="بحث بالاسم أو المبلغ" oninput="render()">
      <select id="filterMonth" onchange="render()">
        <option value="">كل الشهور</option>
      </select>
      <select id="filterYear" onchange="render()">
        <option value="">كل السنوات</option>
      </select>
    </div>
  </div>

  <!-- الجدول -->
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>الاسم</th>
          <th>المبلغ</th>
          <th>العملة</th>
          <th>النوع</th>
          <th>التاريخ</th>
          <th>إجراءات</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- المجاميع -->
  <div class="totals">
    <div>💵 مجموع الدولار: <span id="totalUSD">0</span></div>
    <div>🇸🇾 مجموع السوري: <span id="totalSYP">0</span></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
