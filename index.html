<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتر الحسابات</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="brand">
    <img src="logo.png" class="logo">
    <span>دفتر الحسابات</span>
  </div>
  <button class="icon-btn" onclick="toggleDark()">الوضع الليلي</button>
</header>

<div class="app">

  <!-- إضافة دفعة -->
  <div class="card">
    <h2>إضافة دفعة</h2>
    <div class="form-grid">
      <input id="date" type="date" placeholder="التاريخ">
      <input id="details" placeholder="التفاصيل">
      <input id="debit" type="number" placeholder="عليه">
      <input id="credit" type="number" placeholder="له">
      <button onclick="addPayment()">حفظ الدفعة</button>
    </div>
  </div>

  <!-- الجدول -->
  <div class="card table-wrapper">
    <table>
      <thead>
        <tr>
          <th>التاريخ</th>
          <th>التفاصيل</th>
          <th>عليه</th>
          <th>له</th>
          <th>الرصيد</th>
          <th>إجراءات</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- المجاميع -->
  <div class="card totals">
    <div>مجموع له: <span id="totalCredit">0</span></div>
    <div>مجموع عليه: <span id="totalDebit">0</span></div>
    <div>الرصيد النهائي: <span id="balance">0</span></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
