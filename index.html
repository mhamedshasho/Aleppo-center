<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتر الحسابات</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="brand">
    <img src="logo.png" class="logo">
    <span>دفتر الحسابات</span>
  </div>
  <button class="icon-btn" onclick="toggleDark()">🌙</button>
</header>

<section id="accountsView">
  <div class="card">
    <h2>الحسابات</h2>
    <div class="row">
      <input id="newAccountName" placeholder="اسم الحساب">
      <button class="primary" onclick="addAccount()">إضافة</button>
    </div>
  </div>
  <ul id="accountsList" class="list"></ul>
</section>

<section id="accountView" style="display:none">
  <button class="back" onclick="backToAccounts()">⬅ الرجوع للحسابات</button>
  <h2 id="accountTitle" class="center"></h2>

  <div class="card summary">
    <input id="searchPayment" type="text" placeholder="بحث بالدفع أو السبب..." oninput="renderPayments()">
    <div class="totals">
      <div>💵 USD: <span id="totalUSD">0</span></div>
      <div>🇸🇾 SYP: <span id="totalSYP">0</span></div>
      <div>📝 تعداد: <span id="totalCount">0</span></div>
    </div>
  </div>

  <div class="card accent">
    <h3 id="formTitle">إضافة دفعة</h3>
    <input id="amount" type="number" placeholder="المبلغ">
    <div class="row">
      <select id="currency">
        <option value="USD">دولار</option>
        <option value="SYP">سوري</option>
      </select>
      <select id="direction">
        <option value="in">له</option>
        <option value="out">عليه</option>
      </select>
    </div>
    <input id="type" placeholder="السبب">
    <select id="dateMode" onchange="handleDateMode()">
      <option value="auto">📅 اليوم</option>
      <option value="manual">✍️ يدوي</option>
    </select>
    <input id="date" type="date" style="display:none">
    <button id="saveBtn" class="primary" onclick="savePayment()">حفظ</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>المبلغ</th>
          <th>العملة</th>
          <th>له/عليه</th>
          <th>التاريخ</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

</section>

<script src="script.js"></script>
</body>
</html>
