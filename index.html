<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتر الحسابات</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <img src="logo.png" class="logo">
  <h1>دفتر الحسابات</h1>
  <button onclick="toggleDark()">🌙</button>
</header>

<!-- الحسابات -->
<div id="accountsView" class="card">
  <h2>📂 الحسابات</h2>
  <div class="row">
    <input id="newAccountName" placeholder="اسم الحساب">
    <button onclick="addAccount()">➕</button>
  </div>
  <ul id="accountsList"></ul>
</div>

<!-- حساب واحد -->
<div id="accountView" style="display:none">

  <button class="back" onclick="backToAccounts()">⬅ رجوع</button>
  <h2 id="accountTitle"></h2>

  <div class="card">
    <h3>إضافة دفعة</h3>

    <input id="amount" type="number" placeholder="المبلغ">

    <select id="currency">
      <option value="USD">دولار</option>
      <option value="SYP">سوري</option>
    </select>

    <input id="type" placeholder="السبب">

    <select id="direction">
      <option value="in">له</option>
      <option value="out">عليه</option>
    </select>

    <!-- اختيار نوع التاريخ -->
    <select id="dateMode" onchange="handleDateMode()">
      <option value="auto">📅 تاريخ تلقائي</option>
      <option value="manual">✍️ اختيار يدوي</option>
    </select>

    <!-- تاريخ يدوي -->
    <input id="date" type="date" style="display:none">

    <button onclick="addPayment()">إضافة</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>المبلغ</th>
          <th>العملة</th>
          <th>له / عليه</th>
          <th>التاريخ</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
